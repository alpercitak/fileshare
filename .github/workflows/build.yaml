name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - run: bun install

      - run: bunx biome ci .
      - run: bunx tsc --noEmit -p apps/client
      - run: bunx tsc --noEmit -p apps/server

      - uses: alpercitak/fasttrack@v0.2.2
        with:
          args: --build --test --affected --verbose
