version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Bun is pinned in package.json (packageManager) too; bump both by hand
      - dependency-name: oven/bun
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
